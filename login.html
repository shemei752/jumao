<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="keywords"
			content="橘猫接码平台,Receive SMS Online China,在线短信接收,短信验证码接收,在线短信接收平台,免费短信平台,免费接码平台,免费验证码接收平台,代收手机短信验证码,国外短信接收平台,手机短信验证码,手机验证码平台,接码平台,短信验证码,验证码平台,手机验证码,网站验证码短信平台,接收手机验证码平台,sms短信，接码号 - 在线接收短信验证码，接码短信平台，短信验证码，验证码接收平台，验证码接收，验证码平台，接码，接码验证码平台app，接码软件，接码注册短信平台，接码验证码平台，接码软件，接码网站，free sms receive">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>橘猫接码 - 登录</title>
		<link href="./css/bootstrap.min.css" rel="stylesheet">
		<style>
			body {
				background-image: url('./img/background.jpg');
				background-size: cover;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				margin: 0;
			}

			.form-group {
				margin-top: 5px;
			}

			.modal-header {
				background-color: #ff8a70;
				color: white;
			}

			.login-container {
				background-color: white;
				padding: 20px;
				border-radius: 8px;
				box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
				width: 100%;
				max-width: 400px;
			}

			.login-header {
				background-color: #ff8a70;
				color: white;
				padding: 10px;
				text-align: center;
				border-radius: 8px;
			}

			.login-form {
				margin-top: 20px;
			}

			.login-form input[type="text"],
			.login-form input[type="password"] {
				width: calc(100% - 22px);
				padding: 10px;
				margin-bottom: 10px;
				border: 1px solid #ccc;
				border-radius: 4px;
			}

			.btn-login {
				width: 100%;
				padding: 10px;
				background-color: #ff8a70;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				font-size: 16px;
				transition: background-color 0.3s ease;
			}

			.btn-login:hover,
			.btn-login:focus {
				background-color: #ff8a70;
				outline: none;
			}

			.login-form .register-link {
				display: block;
				text-align: center;
				margin-top: 10px;
				color: #8b0000;
				text-decoration: none;
			}

			.login-form .register-link:hover {
				text-decoration: underline;
			}

			/* 自定义关闭按钮样式 */
			.custom-close {
				color: #ff8a70;
				font-size: 28px;
				font-weight: bold;
				border: none;
				background: none;
				padding: 0;
				margin: 0;
				outline: none;
			}

			.custom-close:hover,
			.custom-close:focus {
				color: #ff8a70;
				text-decoration: none;
				box-shadow: none;
			}

			.link-container {
				display: flex;
				justify-content: space-between;
				/* 水平两端对齐 */
				align-items: center;
				/* 垂直居中对齐 */
				margin-top: 10px;
				/* 根据需要调整间距 */
			}

			.login-link:hover,
			.home-link:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<div class="login-container">
			<div class="login-header">
				<h2>橘猫接码 - 登录</h2>
			</div>
			<form id="loginForm">
				<div class="form-group">
					<label for="loginUsername">登录账号</label>
					<input type="text" class="form-control" id="loginUsername" required>
				</div>
				<div class="form-group">
					<label for="loginPassword">登录密码</label>
					<input type="password" class="form-control" id="loginPassword" required>
				</div>
				<button type="submit" class="btn-login">登 录</button>
				<div class="link-container">
					<a href="register.html" class="register-link">没有账号？点击注册</a>
					<a href="/" class="home-link">返回首页</a>
				</div>
			</form>
		</div>

		<!-- Modal -->
		<div class="modal fade" id="alertModal" tabindex="-1" role="dialog" aria-labelledby="alertModalLabel"
			aria-hidden="true">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="alertModalLabel">提示</h5>
						<button type="button" class="close custom-close" data-dismiss="modal" aria-label="Close">
						</button>
					</div>
					<div class="modal-body">
						<p id="modalMessage"></p>
					</div>
					<div class="modal-footer" style="justify-content: center;">
						<button type="button" class="btn btn-secondary" data-dismiss="modal"
							style="background-color: #ff8a70; box-shadow: none; color: white;">关闭</button>
					</div>
				</div>
			</div>
		</div>

		<script>
			document.getElementById('loginForm').addEventListener('submit', async (e) => {
				e.preventDefault();
				const username = document.getElementById('loginUsername').value;
				const password = document.getElementById('loginPassword').value;

				const db = await openDatabase();
				const success = await loginUser(db, username, password);

				if (success) {
					showModal("成功", "登录成功！");
					localStorage.setItem('loggedInUser', username);
					setTimeout(() => {
						window.location.href = '/'; // Redirect to index page after 1 second
					}, 1000);
				} else {
					showModal("错误", "用户名或密码错误！");
				}
			});

			async function openDatabase() {
				return new Promise((resolve, reject) => {
					const request = indexedDB.open("PandaHeroDB", 1);
					request.onupgradeneeded = function(e) {
						const db = e.target.result;
						if (!db.objectStoreNames.contains("users")) {
							db.createObjectStore("users", {
								keyPath: "username",
								autoIncrement: false
							});
						}
					};
					request.onsuccess = function(e) {
						resolve(e.target.result);
					};
					request.onerror = function(e) {
						reject(e.target.error);
					};
				});
			}

			async function loginUser(db, username, password) {
				const transaction = db.transaction(["users"], "readonly");
				const store = transaction.objectStore("users");
				const request = store.get(username);

				return new Promise((resolve) => {
					request.onsuccess = function() {
						const user = request.result;
						resolve(user && user.password === password);
					};
					request.onerror = function() {
						resolve(false);
					};
				});
			}

			function showModal(title, message) {
				document.getElementById('alertModalLabel').textContent = title;
				document.getElementById('modalMessage').textContent = message;
				$('#alertModal').modal('show');
			}
		</script>

		<!-- 引入 jQuery 和 Bootstrap JS -->
		<script src="./js/jquery-3.5.1.min.js"></script>
		<script src="./js/bootstrap.bundle.min.js"></script>
	</body>
</html>
